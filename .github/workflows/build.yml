name: Build Tauri App

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (release)
        run: npm run tauri build

      - name: Locate artifacts
        id: locate
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release -Filter "*.exe" -Recurse | Select-Object FullName
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse | Select-Object FullName

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: DiskClearTool-portable-exe
          path: src-tauri/target/release/*.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: DiskClearTool-msi
          path: src-tauri/target/release/bundle/msi/*.msi
        continue-on-error: true

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: DiskClearTool-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
        continue-on-error: true

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
